0" y="2815.6" font-size="21" fill="#172a39">有序时可 O(n)；插入适合小规模</text><polyline points="60,2828 3140,2828" fill="none" stroke="#b8c5ca" stroke-width="1"/><rect x="60" y="2828" width="3080" height="40" rx="0" fill="#edf0ed" stroke="none"/><text x="70" y="2855.6" font-size="21" fill="#172a39">选择</text><text x="624.4" y="2855.6" font-size="21" fill="#172a39">O(n^2) / O(n^2)</text><text x="1148.0" y="2855.6" font-size="21" fill="#172a39">O(1)</text><text x="1671.6" y="2855.6" font-size="21" fill="#172a39">否 / 是</text><text x="2072.0" y="2855.6" font-size="21" fill="#172a39">交换少；观察“固定一个位置”</text><polyline points="60,2868 3140,2868" fill="none" stroke="#b8c5ca" stroke-width="1"/><text x="70" y="2895.6" font-size="21" fill="#172a39">归并</text><text x="624.4" y="2895.6" font-size="21" fill="#172a39">O(n log n) / 同</text><text x="1148.0" y="2895.6" font-size="21" fill="#172a39">O(n)</text><text x="1671.6" y="2895.6" font-size="21" fill="#172a39">是 / 否</text><text x="2072.0" y="2895.6" font-size="21" fill="#172a39">分治；稳定合并，有序流</text><polyline points="60,2908 3140,2908" fill="none" stroke="#b8c5ca" stroke-width="1"/><rect x="60" y="2908" width="3080" height="40" rx="0" fill="#edf0ed" stroke="none"/><text x="70" y="2935.6" font-size="21" fill="#172a39">快速 / 堆排序</text><text x="624.4" y="2935.6" font-size="21" fill="#172a39">O(n log n)*</text><text x="1148.0" y="2935.6" font-size="21" fill="#172a39">栈* / O(1)</text><text x="1671.6" y="2935.6" font-size="21" fill="#172a39">否 / 见注</text><text x="2072.0" y="2935.6" font-size="21" fill="#172a39">快排划分；堆排序最坏 O(n log n)</text><polyline points="60,2948 3140,2948" fill="none" stroke="#b8c5ca" stroke-width="1"/><text x="70" y="2975.6" font-size="21" fill="#172a39">计数 / 基数 / 桶</text><text x="624.4" y="2975.6" font-size="21" fill="#172a39">看值域和分布</text><text x="1148.0" y="2975.6" font-size="21" fill="#172a39">看值域和桶</text><text x="1671.6" y="2975.6" font-size="21" fill="#172a39">视实现</text><text x="2072.0" y="2975.6" font-size="21" fill="#172a39">计数 / 基数可稳定；桶稳定性依赖内部排序</text><polyline points="60,2988 3140,2988" fill="none" stroke="#b8c5ca" stroke-width="1"/><text x="60" y="3016" font-size="20" fill="#526573">* 快排最坏 O(n^2)；标准递归栈平均 O(log n)、最坏 O(n)。划分原地，但严格总空间非 O(1)。</text><text x="60" y="3047" font-size="20" fill="#526573">计数 O(n+k) / 空间 O(n+k)；基数 O(d(n+k)) / O(n+k)；桶均匀时期望 O(n+k)，最坏可 O(n^2)。</text><rect x="6380" y="365" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="389" font-size="25" fill="#172a39">频繁精确查找 / 去重 / 计数</text><text x="6400" y="425" font-size="26" fill="#24658a">→ 哈希 dict / set</text><text x="6400" y="455" font-size="19" fill="#526573">R01  |  先看键能否哈希；有序范围查询另选结构。</text><text x="6400" y="507" font-size="25" fill="#172a39">有序数组 / 单调可行性</text><text x="6400" y="543" font-size="26" fill="#24658a">→ 二分；对撞双指针</text><text x="6400" y="573" font-size="19" fill="#526573">S01 · A01  |  二分答案需要单调判定函数。</text><rect x="6380" y="601" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="625" font-size="25" fill="#172a39">连续子数组 / 子串</text><text x="6400" y="661" font-size="26" fill="#24658a">→ 窗口或前缀和</text><text x="6400" y="691" font-size="19" fill="#526573">A01 · A02  |  含负数的和约束不能直接套单调收缩窗口。</text><text x="6400" y="743" font-size="25" fill="#172a39">区间求和 / 许多区间增量</text><text x="6400" y="779" font-size="26" fill="#24658a">→ 前缀和 / 差分</text><text x="6400" y="809" font-size="19" fill="#526573">A02  |  静态预处理；动态查询可进阶树状数组。</text><rect x="6380" y="837" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="861" font-size="25" fill="#172a39">最近更大 / 更小元素</text><text x="6400" y="897" font-size="26" fill="#24658a">→ 单调栈；窗口极值用单调队列</text><text x="6400" y="927" font-size="19" fill="#526573">X03  |  维护候选顺序，解释被弹元素为何无用。</text><text x="6400" y="979" font-size="25" fill="#172a39">最短步数 / 网格扩散</text><text x="6400" y="1015" font-size="26" fill="#24658a">→ BFS；多源 BFS</text><text x="6400" y="1045" font-size="19" fill="#526573">G02 · J30  |  边代价相同；入队标记避免重复。</text><rect x="6380" y="1073" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="1097" font-size="25" fill="#172a39">带权最短路</text><text x="6400" y="1133" font-size="26" fill="#24658a">→ Dijkstra / Bellman-Ford / Floyd</text><text x="6400" y="1163" font-size="19" fill="#526573">G04  |  非负权 / 单源可含负边 / 全源；关注负环。</text><text x="6400" y="1215" font-size="25" fill="#172a39">所有方案 / 排列组合</text><text x="6400" y="1251" font-size="26" fill="#24658a">→ DFS + 回溯</text><text x="6400" y="1281" font-size="19" fill="#526573">A03  |  选择、撤销、去重；输出数量可能指数级。</text><rect x="6380" y="1309" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="1333" font-size="25" fill="#172a39">重复求值 / 计数 / 最优 / 可达</text><text x="6400" y="1369" font-size="26" fill="#24658a">→ 完整状态 → DP</text><text x="6400" y="1399" font-size="19" fill="#526573">D01 · Q12  |  状态相同须能复用未来；依赖顺序明确。</text><text x="6400" y="1451" font-size="25" fill="#172a39">局部选择看似最好</text><text x="6400" y="1487" font-size="26" fill="#24658a">→ 贪心候选 + 正确性论证</text><text x="6400" y="1517" font-size="19" fill="#526573">A04 · J50  |  通过样例不算证明；先找反例。</text><rect x="6380" y="1545" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="1569" font-size="25" fill="#172a39">Top K / 流式最大最小</text><text x="6400" y="1605" font-size="26" fill="#24658a">→ 大小 K 的堆 / 快速选择</text><text x="6400" y="1635" font-size="19" fill="#526573">R04 · X03  |  Top K 常用 O(n log K)；不必全排序。</text><text x="6400" y="1687" font-size="25" fill="#172a39">增量合并 / 连通查询</text><text x="6400" y="1723" font-size="26" fill="#24658a">→ 并查集</text><text x="6400" y="1753" font-size="19" fill="#526573">G03  |  适合合并与查询；普通并查集不支持任意删边。</text><rect x="6380" y="1781" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="1805" font-size="25" fill="#172a39">课程依赖 / 任务先后</text><text x="6400" y="1841" font-size="26" fill="#24658a">→ 有向图 + 拓扑排序</text><text x="6400" y="1871" font-size="19" fill="#526573">G03  |  出现有向环则不存在完整拓扑序。</text><text x="6400" y="1923" font-size="25" fill="#172a39">最省成本连接所有点</text><text x="6400" y="1959" font-size="26" fill="#24658a">→ 最小生成树 Prim / Kruskal</text><text x="6400" y="1989" font-size="19" fill="#526573">G04  |  无向加权图；与两点间最短路目标不同。</text><rect x="6380" y="2017" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="2041" font-size="25" fill="#172a39">层级 / 目录 / 表达式</text><text x="6400" y="2077" font-size="26" fill="#24658a">→ 树 + 遍历</text><text x="6400" y="2107" font-size="19" fill="#526573">R02  |  共享引用或环可能需要一般图。</text><text x="6400" y="2159" font-size="25" fill="#172a39">前缀检索 / 自动补全</text><text x="6400" y="2195" font-size="26" fill="#24658a">→ Trie</text><text x="6400" y="2225" font-size="19" fill="#526573">R04 · X03  |  时间依赖字符串长度；观察字符分支占用。</text><rect x="6380" y="2253" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="2277" font-size="25" fill="#172a39">嵌套匹配 / 撤销 / 表达式</text><text x="6400" y="2313" font-size="26" fill="#24658a">→ 栈</text><text x="6400" y="2343" font-size="19" fill="#526573">L03  |  最近尚未匹配的对象优先处理。</text><text x="6400" y="2395" font-size="25" fill="#172a39">链表中点 / 环 / 原地配对</text><text x="6400" y="2431" font-size="26" fill="#24658a">→ 快慢指针 / 双指针</text><text x="6400" y="2461" font-size="19" fill="#526573">L02 · A01  |  先证明指针不变量，再处理终止条件。</text><rect x="6380" y="2489" width="1160" height="114" rx="5" fill="#eaf0f1" stroke="none"/><text x="6400" y="2513" font-size="25" fill="#172a39">范围查询且频繁更新</text><text x="6400" y="2549" font-size="26" fill="#24658a">→ 平衡树 / 树状数组 / 线段树</text><text x="6400" y="2579" font-size="19" fill="#526573">R03 · X03  |  第二阶段按操作种类选；先用简单基准解。</text><text x="6400" y="2631" font-size="25" fill="#172a39">两段序列 / 小集合 / 子树</text><text x="6400" y="2667" font-size="26" fill="#24658a">→ 二维 / 状压 / 树形 DP</text><text x="6400" y="2697" font-size="19" fill="#526573">Q06 · Q10 · Q11  |  结构给出候选状态，仍需定义转移。</text><text x="6400" y="2820" font-size="30" fill="#172a39">做 $('close').onclick=()=>$('detail').hidden=true;$('save').onclick=()=>{if(!selected)return;progress[selected]={status:$('status').value,note:$('note').value,updated:new Date().toISOString().slice(0,10)};try{localStorage.setItem(key,JSON.stringify(progress));paint();msg('已保存 '+selected)}catch(e){paint();msg('浏览器无法持久保存，请导出进度')}};
function find(){const q=$('search').value.trim().toLowerCase();if(!q)return;const n=nodes.find(n=>(n.id+' '+n.title+' '+n.lines.join(' ')).toLowerCase().includes(q));if(n){go(n.x-20,n.y-100,1700);choose(n.id)}else msg('未找到节点')} $('find').onclick=find;$('search').onkeydown=e=>{if(e.key==='Enter')find()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({course:'数据结构与算法',progress},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='数据结构与算法_学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v.progress||typeof v.progress!=='object')throw Error();for(const [id,p] of Object.entries(v.progress)){if(byId[id]&&p&&Object.hasOwn(colors,p.status))progress[id]={status:p.status,note:String(p.note||''),updated:String(p.updated||'')}}localStorage.setItem(key,JSON.stringify(progress));paint();if(selected)choose(selected);msg('进度已导入')}catch(err){msg('无法导入，请选择导出的进度 JSON 文件')}e.target.value=''};

function trace(id){const root=document.querySelector('#map svg');let layer=$('dependency-trace');if(!layer){layer=document.createElementNS('http://www.w3.org/2000/svg','g');layer.id='dependency-trace';layer.style.pointerEvents='none';root.insertBefore(layer,root.querySelector('.node'))}layer.replaceChildren();const dest=byId[id];dest.pre.forEach((p,i)=>{const a=byId[p],sx=a.x+a.w-32-i*18,sy=a.y+a.h,tx=dest.x,ty=dest.y+dest.h-34;const rail=sy+12+i*3,gutter=tx-12;const points=[[sx,sy],[sx,rail],[gutter,rail],[gutter,ty],[tx,ty]];const poly=document.createElementNS(root.namespaceURI,'polyline');poly.setAttribute('points',points.map(p=>p.join(',')).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#24658a');poly.setAttribute('stroke-width','4');layer.append(poly);const tip=document.createElementNS(root.namespaceURI,'polygon');tip.setAttribute('points',`${tx},${ty} ${tx-12},${ty-6} ${tx-12},${ty+6}`);tip.setAttribute('fill','#24658a');layer.append(tip)})}
paint();$('fit').click();
</script></body></html>
